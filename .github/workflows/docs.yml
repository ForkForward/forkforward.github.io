name: Site

# Builds this site with Zensical (configuration: zensical.toml) and publishes it to GitHub Pages
# at https://forkforward.dev/.
#
# Pull requests only build it, in strict mode, so a broken link fails the check.
# Pushes to main build it and publish it.
#
# One-time setup in the repository settings, under Pages:
# - Build and deployment > Source: GitHub Actions.
# - Custom domain: forkforward.dev, then Enforce HTTPS once the certificate is issued.
#   Project sites of the organization, such as dotnet-mapper, are then served under that domain too.
# GitHub creates the environment "github-pages" on the first deployment; it accepts deployments
# from main only.
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer commit replaces a pull request build, but a deployment that has started is allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install Zensical
      run: pip install -r requirements.txt
    - name: Build
      run: zensical build --clean --strict
    - name: Upload site
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publishes the site
      id-token: write  # proves to GitHub Pages that the site was built by this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
